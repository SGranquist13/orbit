[package]
name = "orbit"
version = "0.1.0"
description = "Orbit: run a fleet of coding agents in parallel worktrees and ship"
authors = ["SGranquist13"]
license = "MIT"
repository = "https://github.com/SGranquist13/orbit"
homepage = "https://github.com/SGranquist13/orbit"
rust-version = "1.97"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time", "net"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
anyhow = "1.0.104"
uuid = { version = "1.27.0", features = ["v4"] }
which = "8.0.6"
dirs = "7.0.0"
chrono = "0.4.45"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-notification = "2.5.1"
# mobile bridge (src/remote/)
crypto_box = { version = "0.9", features = ["std", "salsa20"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
if-addrs = "0.13"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
